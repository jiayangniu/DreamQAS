# DreamQAS 8q rotosolve config (H2O STO-3G, 4e/4o, equilibrium geometry). GPU BatchedVQE.
# Generated 2026-07-30 by patching G0_v2_BeH2_10q.cfg; ONLY num_qubits, fake_min_energy,
# ham_type, geometry and this header differ -- everything else is inherited.
#   Hamiltonian: data/mol_data/H2O_8q_geom_O_.0_.0_0.0;_H_.0_0.757_0.586;_H_.0_-0.757_0.586_jordan_wigner.npz
#     md5 7fe6ac67223a2368d2dbd896f76b1c30.  Active space certified by regeneration
#     (pennylane.qchem sto-3g 4e/4o reproduces energy_shift to 8 dp and all 104 Paulis).
#   NOT PSQASBench's T3_H2O_StrongCorr_8q, which is a DIFFERENT stretched geometry.
#   E0 = -74.97036284 Ha;  fake_min_energy = E0 - 2.28.
[runtime]
# BLAS thread cap per process (OMP/MKL/OpenBLAS). Set by runtime_init.py
# BEFORE numpy/torch import. =1 prevents single-process oversubscription
# when many runs share the node.
num_threads = 1

[general]
episodes = 10000

[env]
num_qubits = 8
num_layers = 50
err_mitig = 0
rand_halt = 0
refine_delta_coef = 0.0

n_shots = 0
noise_models = 0
noise_values = 0

fake_min_energy = -77.2504
fn_type = incremental_with_fixed_start
accept_err = 2.45
shift_threshold_time = 500
shift_threshold_ball = 0.5e-3
success_thresh = 25
succ_radius_shift = 10
succes_switch = 4
thresholds = []
switch_episodes = []
curriculum_type = MovingThreshold


[problem]
ham_type = H2O
geometry = O .0 .0 0.0; H .0 0.757 0.586; H .0 -0.757 0.586
taper = 1
mapping = jordan_wigner

[agent]
# Dummy section required by CircuitEnv/utils; WM v2 does not use HyRLQAS agent.
batch_size = 16
angle_activation = tanh
map_theta = 1
neurons = [512,512,512]
dropout = 0.
learning_rate = 0.0001
angles = 0
en_state = 0
threshold_in_state = 0
agent_type = Hybrid_REINFORCE
agent_class = HybridActionPolicy
n_step = 5
init_net = 0
normalize_returns = none
entropy_coef = 0.
grad_clip = 0.

update_target_net = 500
final_gamma = 0.005


[non_local_opt]
external_opt = 1
scope = all
k = 1

a = 1.707
alpha = 0.6589
c = 0.0279
gamma = 0.0692

maxfev1 = 0
maxfev2 = 0
maxfev3 = 0
beta_1 = 0
beta_2 = 0

global_iters = 1000
method = scipy_each_step
optim_alg = ROTOSOLVE
rotosolve_sweeps = 1
writeback_coef = 1.0


[world_model]
# ── Training loop ──────────────────────────────────────────────
n_iterations = 1500
real_episodes_per_iter = 4
buffer_max_episodes = 800

# ── WM training ────────────────────────────────────────────────
wm_train_interval = 5
wm_train_steps = 50
wm_batch_size = 16
wm_seq_len = 70
wm_train_episodes = 400

# ── RSSM architecture ──────────────────────────────────────────
wm_hidden_dim = 512
wm_latent_categories = 32
wm_latent_classes = 32
wm_embed_dim = 64
wm_lr = 1e-4

# ── Imagination ────────────────────────────────────────────────
imag_horizon = 10
imag_n_samples = 256
imag_lr = 3e-5
imag_gamma = 0.997
imag_entropy_coef = 1e-3

# ── rho EMA ────────────────────────────────────────────────────
rho_ema_alpha = 0.85

# ── Shared actor ───────────────────────────────────────────────
actor_lr = 3e-5
actor_hidden_dim = 512
real_reinforce_gamma = 0.99
