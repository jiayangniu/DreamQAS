# WM-QAS v2 Baseline config: LiH 6-qubit, no world model / imagination.
# Identical env/curriculum/reward to LiH6q_wm_v2.cfg for fair comparison.
# max_episodes = 30000 (> v2's 6000 real eps, ample room for baseline to plateau)
[runtime]
# BLAS thread cap per process (OMP/MKL/OpenBLAS). Set by runtime_init.py
# BEFORE numpy/torch import. =1 prevents single-process oversubscription
# when many runs share the node.
num_threads = 1

[general]
episodes = 30000

[baseline]
max_episodes = 30000
real_episodes_per_iter = 4
actor_hidden_dim = 512
actor_lr = 3e-5
entropy_coef = 1e-3
reinforce_gamma = 0.99

[env]
num_qubits = 6
num_layers = 30
err_mitig = 0
rand_halt = 0
refine_delta_coef = 0.0

n_shots = 0
noise_models = 0
noise_values = 0

fake_min_energy = -17.14
fn_type = incremental_with_fixed_start
accept_err = 2.45
shift_threshold_time = 500
shift_threshold_ball = 0.5e-3
success_thresh = 25
succ_radius_shift = 10
succes_switch = 4
thresholds = []
switch_episodes = []
curriculum_type = MovingThreshold


[problem]
ham_type = BEH2
geometry = H 0. 0. -1.33; Be 0. 0. 0.; H 0. 0. 1.33
taper = 1
mapping = jordan_wigner

[agent]
# Dummy section required by CircuitEnv/utils.
batch_size = 16
angle_activation = tanh
map_theta = 1
neurons = [512,512,512]
dropout = 0.
learning_rate = 0.0001
angles = 0
en_state = 0
threshold_in_state = 0
agent_type = Hybrid_REINFORCE
agent_class = HybridActionPolicy
n_step = 5
init_net = 0
normalize_returns = none
entropy_coef = 0.
grad_clip = 0.

update_target_net = 500
final_gamma = 0.005


[non_local_opt]
external_opt = 1
scope = all
k = 1

a = 1.707
alpha = 0.6589
c = 0.0279
gamma = 0.0692

maxfev1 = 0
maxfev2 = 0
maxfev3 = 0
beta_1 = 0
beta_2 = 0

global_iters = 1000
method = scipy_each_step
optim_alg = COBYLA
writeback_coef = 1.0
