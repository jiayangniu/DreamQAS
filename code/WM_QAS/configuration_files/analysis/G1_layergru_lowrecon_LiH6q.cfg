# WM-QAS v2 config: LiH 6-qubit — unified training loop
# Derived from LiH4q_wm_v2.cfg; key adjustments:
#   num_layers 40 → 60          (6q needs more depth; obs_dim = 60×9×6 = 3240)
#   n_iterations 2000 → 1500   (4q converges at ~400; 6q harder but budget capped)
#   wm_train_episodes: 400 (same as 4q; 6q episodes are longer so step-count coverage is similar)
#   wm_seq_len 50 → 70          (≥ num_layers=60, covers full episode)
#   buffer_max_episodes 1000 → 800 (total eps = 6000, 800 ≈ 13%)
#   fake_min_energy: same ~2.28 Ha gap below 6q FCI (-7.845 Ha)
#   geometry / mapping / num_qubits: 6q LiH jordan_wigner
[runtime]
# BLAS thread cap per process (OMP/MKL/OpenBLAS). Set by runtime_init.py
# BEFORE numpy/torch import. =1 prevents single-process oversubscription
# when many runs share the node.
num_threads = 1

[general]
episodes = 10000

[env]
num_qubits = 6
num_layers = 40
err_mitig = 0
rand_halt = 0
refine_delta_coef = 0.0

n_shots = 0
noise_models = 0
noise_values = 0

fake_min_energy = -10.12
fn_type = incremental_with_fixed_start
accept_err = 2.45
shift_threshold_time = 500
shift_threshold_ball = 0.5e-3
success_thresh = 25
succ_radius_shift = 10
succes_switch = 4
thresholds = []
switch_episodes = []
curriculum_type = MovingThreshold


[problem]
ham_type = LiH
geometry = Li .0 .0 .0; H .0 .0 2.2
taper = 1
mapping = jordan_wigner

[agent]
# Dummy section required by CircuitEnv/utils; WM v2 does not use HyRLQAS agent.
batch_size = 16
angle_activation = tanh
map_theta = 1
neurons = [512,512,512]
dropout = 0.
learning_rate = 0.0001
angles = 0
en_state = 0
threshold_in_state = 0
agent_type = Hybrid_REINFORCE
agent_class = HybridActionPolicy
n_step = 5
init_net = 0
normalize_returns = none
entropy_coef = 0.
grad_clip = 0.

update_target_net = 500
final_gamma = 0.005


[non_local_opt]
external_opt = 1
scope = all
k = 1

a = 1.707
alpha = 0.6589
c = 0.0279
gamma = 0.0692

maxfev1 = 0
maxfev2 = 0
maxfev3 = 0
beta_1 = 0
beta_2 = 0

global_iters = 1000
method = scipy_each_step
optim_alg = COBYLA
writeback_coef = 1.0


[world_model]
# ── Training loop ──────────────────────────────────────────────
n_iterations = 1500
real_episodes_per_iter = 4
buffer_max_episodes = 800

# ── WM training ────────────────────────────────────────────────
wm_train_interval = 5
wm_train_steps = 50
wm_batch_size = 16
wm_seq_len = 70
wm_train_episodes = 400

# ── RSSM architecture ──────────────────────────────────────────
wm_hidden_dim = 512
wm_latent_categories = 32
wm_latent_classes = 32
wm_embed_dim = 64
wm_lr = 1e-4

# ── Imagination ────────────────────────────────────────────────
imag_horizon = 10
imag_n_samples = 256
imag_lr = 3e-5
imag_gamma = 0.997
imag_entropy_coef = 1e-3

# ── rho EMA ────────────────────────────────────────────────────
rho_ema_alpha = 0.85

# ── Shared actor ───────────────────────────────────────────────
actor_lr = 3e-5
actor_hidden_dim = 512
real_reinforce_gamma = 0.99

# ── Ablation O2: layer-GRU encoder (Phase-1 architecture) ─────
encoder_type = layer_gru

# ── Combo ablation: also down-weight decoder ──────────────────
wm_rec_coef = 0.1
