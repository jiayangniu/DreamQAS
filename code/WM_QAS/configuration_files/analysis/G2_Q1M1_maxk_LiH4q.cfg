# WM-QAS v2 Phase 2.5 ablation — Q1 staircase + M1 max-of-K (LiH 4q)
# Builds on abl_reward (Q1 staircase) by enabling per-init top-quantile baseline.
# Compute parity: n_samples=32 × k_inner=8 = 256 trajs (matches v2 n_samples=256).
[runtime]
num_threads = 1

[general]
episodes = 10000

[env]
num_qubits = 4
num_layers = 30
err_mitig = 0
rand_halt = 0
refine_delta_coef = 0.0

n_shots = 0
noise_models = 0
noise_values = 0

fake_min_energy = -10.0717
fn_type = staircase
accept_err = 2.45
shift_threshold_time = 500
shift_threshold_ball = 0.5e-3
success_thresh = 25
succ_radius_shift = 10
succes_switch = 4
thresholds = []
switch_episodes = []
curriculum_type = MovingThreshold


[problem]
ham_type = LiH
geometry = Li .0 .0 .0; H .0 .0 3.4
taper = 1
mapping = parity

[agent]
batch_size = 16
angle_activation = tanh
map_theta = 1
neurons = [512,512,512]
dropout = 0.
learning_rate = 0.0001
angles = 0
en_state = 0
threshold_in_state = 0
agent_type = Hybrid_REINFORCE
agent_class = HybridActionPolicy
n_step = 5
init_net = 0
normalize_returns = none
entropy_coef = 0.
grad_clip = 0.

update_target_net = 500
final_gamma = 0.005


[non_local_opt]
external_opt = 1
scope = all
k = 1

a = 1.707
alpha = 0.6589
c = 0.0279
gamma = 0.0692

maxfev1 = 0
maxfev2 = 0
maxfev3 = 0
beta_1 = 0
beta_2 = 0

global_iters = 1000
method = scipy_each_step
optim_alg = COBYLA
writeback_coef = 1.0


[world_model]
n_iterations = 1000
real_episodes_per_iter = 4
buffer_max_episodes = 1000

wm_train_interval = 5
wm_train_steps = 50
wm_batch_size = 16
wm_seq_len = 50
wm_train_episodes = 400

wm_hidden_dim = 512
wm_latent_categories = 32
wm_latent_classes = 32
wm_embed_dim = 64
wm_lr = 1e-4

imag_horizon = 10
imag_n_samples = 32
imag_lr = 3e-5
imag_gamma = 0.997
imag_entropy_coef = 1e-3

# ── M1 max-of-K knobs ─────────────────────────────────────────
max_of_k = 1
imag_k_inner = 8
imag_topk_quantile = 0.25
# ──────────────────────────────────────────────────────────────

rho_ema_alpha = 0.85

actor_lr = 3e-5
actor_hidden_dim = 512
real_reinforce_gamma = 0.99
